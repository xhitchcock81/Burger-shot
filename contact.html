<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Burger Shot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-dark text-white">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="images/burger-shot-logo.png" height="55" class="me-2">
            Burger Shot
        </a>

    </div>
</nav>

<div class="container py-5">

<h1 class="text-center text-warning mb-3">
📞 Contact Burger Shot
</h1>

<p class="text-center mb-5">
Questions, partnerships, complaints, or feedback? We'd love to hear from you.
</p>

<div class="card bg-black border-warning">

<div class="card-body">

<input
id="name"
class="form-control mb-3"
placeholder="Your Name">

<input
id="discord"
class="form-control mb-3"
placeholder="Discord Username">

<input
id="subject"
class="form-control mb-3"
placeholder="Subject">

<textarea
id="message"
class="form-control mb-4"
rows="6"
placeholder="Your Message"></textarea>

<button
id="sendMessage"
class="btn btn-warning w-100">

📨 Send Message

</button>

</div>

</div>

</div>

<script src="js/contact.js"></script>

</body>
</html>
