<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Menu | Burger Shot</title>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="index.html">🍔 Burger Shot</a>

Add To Cart

</div>
</div>

<div class="col-md-4">
<div class="card h-100">

data-price="400">

Add To Cart

</button>

</div>
</div>

<div class="card-body text-center">

<p>$450</p>

<button class="btn btn-warning add-cart"
data-name="Chocy Milk"
data-price="450">

Add To Cart

</button>

</div>
</div>
</div>
