<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers | Burger Shot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-dark text-white">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="images/burger-shot-logo.png" height="55" class="me-2">
            Burger Shot
        </a>

    </div>
</nav>

<div class="container py-5">

    <h1 class="text-center text-warning mb-3">
        🍔 Join the Burger Shot Team
    </h1>

    <p class="text-center mb-5">
        Fuel the Streets. Build Your Career.
    </p>

    <div class="card bg-black text-white border-warning">

        <div class="card-body">

            <input id="rpName" class="form-control mb-3" placeholder="RP Name">

            <input id="discord" class="form-control mb-3" placeholder="Discord Username">

            <input id="age" class="form-control mb-3" placeholder="Age">

            <select id="position" class="form-select mb-3">
                <option>Cashier</option>
                <option>Cook</option>
                <option>Drive-Thru</option>
                <option>Shift Supervisor</option>
                <option>Manager</option>
            </select>

            <textarea id="experience" class="form-control mb-3" rows="3" placeholder="Previous Experience"></textarea>

            <select id="availability" class="form-select mb-3">
                <option>Full Time</option>
                <option>Part Time</option>
                <option>Evenings</option>
                <option>Weekends</option>
            </select>

            <textarea id="why" class="form-control mb-4" rows="5" placeholder="Why should we hire you?"></textarea>

            <button id="submitApplication" class="btn btn-warning w-100">
                🍔 Submit Application
            </button>

        </div>

    </div>

</div>

<script src="js/careers.js"></script>

</body>
</html>
