<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Burger Shot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-dark text-white">

<div class="container py-5">

    <div class="mx-auto" style="max-width:700px;">

        <h1 class="text-center mb-4">
            🍔 Burger Shot Checkout
        </h1>

        <div class="card bg-black text-white border-warning">

            <div class="card-body">

                <h4>Your Information</h4>

                <input id="customerName" class="form-control mb-3" placeholder="RP Name">

                <input id="discordName" class="form-control mb-3" placeholder="Discord Username">

                <label class="mb-2">Order Type</label>

                <select id="orderType" class="form-select mb-4">

                    <option>Pickup</option>

                    <option>Drive-Thru</option>

                    <option>Delivery</option>

                </select>

                <textarea
                    id="notes"
                    class="form-control mb-4"
                    rows="4"
                    placeholder="Special Instructions"></textarea>

                <h4>Order Summary</h4>

                <div id="orderSummary" class="mb-4">

                    Loading...

                </div>

                <button
                    id="placeOrder"
                    class="btn btn-warning w-100">

                    🍔 Place Order

                </button>

            </div>

        </div>

    </div>

</div>

<script src="js/checkout.js"></script>

</body>
</html>
