<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Burger Shot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">
<div class="d-flex justify-content-between align-items-center w-100">

    <a class="navbar-brand" href="index.html">
        🍔 Burger Shot
    </a>

    <button
        class="btn btn-warning"
        id="cartButton">

        🛒 Cart
        <span id="cartCount" class="badge bg-dark">0</span>

    </button>

</div>
</div>
</nav>

<div class="container py-5">

<h1 class="text-center mb-5">Burger Shot Menu</h1>

<div class="row g-4">

<div class="col-md-4">
<div class="card h-100">
<div class="card-body text-center">

<h3>🍔 Classic Burger</h3>

<p>$500</p>

<button class="btn btn-warning add-cart"
data-name="Classic Burger"
data-price="500">

Add To Cart

</button>

</div>
</div>
</div>

<div class="col-md-4">
<div class="card h-100">
<div class="card-body text-center">

<h3>🥤 Root Beer</h3>

<p>$400</p>

<button class="btn btn-warning add-cart"
data-name="Root Beer"
data-price="400">

Add To Cart

</button>

</div>
</div>
</div>

<div class="col-md-4">
<div class="card h-100">
<div class="card-body text-center">

<h3>🥛 Chocy Milk</h3>

<p>$450</p>

<button class="btn btn-warning add-cart"
data-name="Chocy Milk"
data-price="450">

Add To Cart

</button>

</div>
</div>
</div>

<div class="col-md-4">
<div class="card h-100 border-danger">
<div class="card-body text-center">

<h3>🍟 French Fries</h3>

<p>$350</p>

<span class="badge bg-danger">
Currently Unavailable
</span>

</div>
</div>
</div>

</div>

</div>
<div id="cartPanel" class="cart-panel">

    <div class="cart-header">

        <h3>Your Order</h3>

        <button id="closeCart" class="btn btn-danger">
            X
        </button>

    </div>

    <div id="cartItems">

        <p>Your cart is empty.</p>

    </div>

    <hr>

    <h4>
        Total:
        $<span id="cartTotal">0</span>
    </h4>

    <button class="btn btn-success w-100">
        Checkout
    </button>

</div>
<script src="js/cart.js"></script>

</body>
</html>
